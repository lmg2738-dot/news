# 10분마다 수집·텔레그램·data/news-state.json 저장 후 커밋 (Blob 불필요)
name: CJ News Batch (10min)

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  batch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci

      - name: Run news batch
        run: npm run batch:once

      - name: Commit news state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/news-state.json
          if git diff --staged --quiet; then
            echo "No changes to news-state.json"
          else
            git commit -m "chore: update news state [skip ci]"
            git push
          fi
